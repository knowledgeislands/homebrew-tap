name: Propose tool releases

on:
  repository_dispatch:
    types: [tool-release-published]
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: propose-tool-releases
  cancel-in-progress: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - name: Create tap-scoped release bot token
        id: release-bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KI_TOOLS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KI_TOOLS_RELEASE_BOT_PRIVATE_KEY }}
          owner: knowledgeislands
          repositories: homebrew-tap
      - uses: actions/checkout@v4
        with:
          token: ${{ steps.release-bot.outputs.token }}
      - name: Validate release dispatch
        if: github.event_name == 'repository_dispatch'
        env:
          SOURCE_REPOSITORY: ${{ github.event.client_payload.repository }}
          SOURCE_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "invalid release tag: $SOURCE_TAG" >&2; exit 1; }
          for formula in Formula/*.rb; do
            if [[ $(ruby scripts/tool-release-events.rb release "$formula" | jq -r .source_repository) == "$SOURCE_REPOSITORY" ]]; then
              echo "Release dispatch: $SOURCE_REPOSITORY $SOURCE_TAG; scanning every formula." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
          done
          echo "repository is not a tapped formula source: $SOURCE_REPOSITORY" >&2
          exit 1
      - name: Test release proposal
        run: ruby test/propose_tool_release_test.rb
      - name: Propose immutable release updates
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name 'ki-tools-release-bot[bot]'
          git config user.email 'ki-tools-release-bot[bot]@users.noreply.github.com'
          for formula in Formula/*.rb; do
            details=$(ruby scripts/tool-release-events.rb release "$formula")
            repository=$(jq -r .source_repository <<< "$details")
            name=$(jq -r .tool <<< "$details")
            gh api "repos/$repository/releases/latest" > "$RUNNER_TEMP/latest-release.json"
            version=$(jq -r .tag_name "$RUNNER_TEMP/latest-release.json")
            if [[ $(jq -r .immutable "$RUNNER_TEMP/latest-release.json") != true ]]; then
              echo "$name: latest release is not immutable; skipped." >> "$GITHUB_STEP_SUMMARY"
              continue
            fi
            ruby scripts/propose-tool-release.rb "$formula" "$RUNNER_TEMP/latest-release.json"
            if git diff --quiet -- "$formula"; then
              continue
            fi
            branch="automation/formula-$name-$version"
            if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
              echo "$name $version: proposal branch already exists; inspect its PR." >> "$GITHUB_STEP_SUMMARY"
              git restore -- "$formula"
              continue
            fi
            git switch -c "$branch"
            git add -- "$formula"
            git commit -m "chore(formula): advance $name to $version"
            git push origin "HEAD:refs/heads/$branch"
            gh pr create --base main --head "$branch" --title "Advance $name to $version" \
              --body "Exact formula update for immutable $repository@$version. Auto-merges by squash once the required KI governance and Homebrew formula gates checks pass."
            gh pr merge "$branch" --auto --squash
            echo "$name $version: formula PR opened with auto-merge; awaiting required checks." >> "$GITHUB_STEP_SUMMARY"
            git switch main
          done
