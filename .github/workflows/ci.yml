name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to re-dispatch to release consumers after a transient failure
        required: true
        type: string

permissions:
  contents: read

env:
  KI_VERSION: v0.6.1

jobs:
  governance:
    name: KI governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install released KI
        env:
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          KI_MCP_SOURCE: ${{ runner.temp }}/ki/mcp-servers.yaml
          XDG_STATE_HOME: ${{ runner.temp }}/ki/state
          KI_STATE_HOME: ${{ runner.temp }}/ki/state/ki
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{"autoMemoryEnabled": false}\n' > "$HOME/.claude/settings.json"
          mkdir -p "$(dirname "$KI_MCP_SOURCE")"
          printf 'mcpServers: []\n' > "$KI_MCP_SOURCE"
          curl --fail -sSL --proto '=https' -o "$RUNNER_TEMP/install.sh" \
            "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "v$(ki --version)" = "$KI_VERSION"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'KI_MCP_SOURCE=%s\n' "$KI_MCP_SOURCE"
            printf 'XDG_STATE_HOME=%s\n' "$XDG_STATE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit
        run: ki repo audit --repo .
      - name: Test tool release event extraction and consumers
        run: ruby test/tool_release_events_test.rb
      - name: Test tool release proposal
        run: ruby test/propose_tool_release_test.rb

  changes:
    name: Detect formula changes
    runs-on: ubuntu-latest
    outputs:
      formulae: ${{ steps.detect.outputs.formulae }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select changed formulae
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          RETRY_FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            name=${RETRY_FORMULA##*/}
            name=${name%.rb}
            [[ "$name" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]
            formulae="Formula/$name.rb"
          elif [[ -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            formulae=$(git diff --name-only "$BASE_SHA" "$GITHUB_SHA" -- 'Formula/*.rb')
          else
            formulae=$(git diff-tree --no-commit-id --name-only -r "$GITHUB_SHA" -- 'Formula/*.rb')
          fi
          selected=()
          while IFS= read -r formula; do
            [[ -n "$formula" ]] || continue
            [[ "$formula" =~ ^Formula/[a-z0-9]+(-[a-z0-9]+)*\.rb$ ]]
            test -f "$formula"
            selected+=("$formula")
          done <<< "$formulae"
          echo "formulae=${selected[*]}" >> "$GITHUB_OUTPUT"
          if (( ${#selected[@]} )); then
            printf 'Changed formulae: %s\n' "${selected[*]}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changed formulae to verify." >> "$GITHUB_STEP_SUMMARY"
          fi

  formula-gates:
    name: Homebrew formula gates
    needs: changes
    # A skipped job satisfies the required check; failed detection still runs and fails here.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.formulae != '') }}
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Require formula change detection
        if: needs.changes.result != 'success'
        run: |
          echo "Formula change detection did not succeed." >&2
          exit 1
      - uses: actions/checkout@v4
      - name: Verify changed formulae
        env:
          FORMULAE: ${{ needs.changes.outputs.formulae }}
        run: |
          set -euo pipefail
          brew tap knowledgeislands/tap "$GITHUB_WORKSPACE"
          read -r -a formulae <<< "$FORMULAE"
          for formula in "${formulae[@]}"; do
            [[ "$formula" =~ ^Formula/[a-z0-9]+(-[a-z0-9]+)*\.rb$ ]]
            name=${formula#Formula/}
            name=${name%.rb}
            brew style "$formula"
            brew audit --strict --online "knowledgeislands/tap/$name"
            brew install --build-from-source "knowledgeislands/tap/$name"
            brew test "knowledgeislands/tap/$name"
          done

  notify-consumers:
    name: Notify release consumers
    needs: [governance, formula-gates]
    if: >-
      !cancelled() && needs.governance.result == 'success' &&
      (needs.formula-gates.result == 'success' || needs.formula-gates.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select formula releases
        id: releases
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RETRY_FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test "$RETRY_FORMULA" = "${RETRY_FORMULA##*/}"
            test "$RETRY_FORMULA" = "${RETRY_FORMULA%.rb}"
            formulas="Formula/$RETRY_FORMULA.rb"
            test -f "$formulas"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            formulas=$(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA" -- 'Formula/*.rb')
          else
            formulas=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'Formula/*.rb')
          fi

          : > "$RUNNER_TEMP/formula-releases"
          if [[ -n "$formulas" ]]; then
            while IFS= read -r formula; do
              ruby scripts/tool-release-events.rb release "$formula" >> "$RUNNER_TEMP/formula-releases"
            done <<< "$formulas"
          fi

          if [[ -s "$RUNNER_TEMP/formula-releases" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No tool formula release changes to notify." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Resolve release consumers
        if: steps.releases.outputs.found == 'true'
        id: consumers
        run: |
          set -euo pipefail
          ruby scripts/tool-release-events.rb consumers .github/tool-release-consumers.json > "$RUNNER_TEMP/release-consumers"
          repositories=$(sed 's#^knowledgeislands/##' "$RUNNER_TEMP/release-consumers" | paste -sd, -)
          echo "repositories=$repositories" >> "$GITHUB_OUTPUT"
      - name: Create tools release bot token
        if: steps.releases.outputs.found == 'true'
        id: release-bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KI_TOOLS_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KI_TOOLS_RELEASE_BOT_PRIVATE_KEY }}
          owner: knowledgeislands
          repositories: ${{ steps.consumers.outputs.repositories }}
      - name: Dispatch verified tool releases
        if: steps.releases.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAP_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r release; do
            payload=$(jq -cn --argjson release "$release" --arg tap_commit "$TAP_COMMIT" '{event_type: "tool-release-published", client_payload: ($release + {tap_commit: $tap_commit})}')
            while IFS= read -r consumer; do
              gh api --method POST "repos/$consumer/dispatches" --input - <<< "$payload"
              echo "Dispatched $(jq -r '.tool + " " + .version' <<< "$release") to $consumer" >> "$GITHUB_STEP_SUMMARY"
            done < "$RUNNER_TEMP/release-consumers"
          done < "$RUNNER_TEMP/formula-releases"
