name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      formula:
        description: Formula name to re-dispatch after a transient delivery failure
        required: true
        type: string

permissions:
  contents: read

jobs:
  governance:
    name: KI governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install and verify released KI
        env:
          KI_VERSION: v0.4.0
          KI_CLI_INSTALL_DIR: ${{ runner.temp }}/ki/bin
          KI_MAN_INSTALL_DIR: ${{ runner.temp }}/ki/man/man1
          KI_DATA_HOME: ${{ runner.temp }}/ki/data
          KI_CONFIG_HOME: ${{ runner.temp }}/ki/config
          KI_CACHE_HOME: ${{ runner.temp }}/ki/cache
          XDG_STATE_HOME: ${{ runner.temp }}/ki/state
          KI_STATE_HOME: ${{ runner.temp }}/ki/state/ki
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.agents" "$HOME/.claude"
          printf '{}\n' > "$HOME/.claude/settings.json"
          curl --fail --silent --show-error --location --max-redirs 3 --proto '=https' --proto-redir '=https' \
            --output "$RUNNER_TEMP/ki-install.sh" "https://raw.githubusercontent.com/knowledgeislands/tools-ki/$KI_VERSION/install.sh"
          bash "$RUNNER_TEMP/ki-install.sh" "$KI_VERSION"
          export PATH="$KI_CLI_INSTALL_DIR:$PATH"
          test "$(command -v ki)" = "$KI_CLI_INSTALL_DIR/ki"
          test "$(ki --version)" = "${KI_VERSION#v}"
          ki manage diag | grep -F 'Installation: regular'
          ki manage diag | grep -F "Executable: $KI_CLI_INSTALL_DIR/ki"
          ki bootstrap
          ki registry add --repo .
          ki repo repair --repo .
          project_key=${GITHUB_WORKSPACE//\//-}
          mkdir -p "$HOME/.claude/projects/$project_key/memory"
          touch "$HOME/.claude/projects/$project_key/memory/MEMORY.md"
          ki manage diag | grep -F 'Status: valid'
          ki harness list | grep -F 'knowledgeislands/ki-agentic-harness'
          {
            printf 'KI_CLI_INSTALL_DIR=%s\n' "$KI_CLI_INSTALL_DIR"
            printf 'KI_MAN_INSTALL_DIR=%s\n' "$KI_MAN_INSTALL_DIR"
            printf 'KI_DATA_HOME=%s\n' "$KI_DATA_HOME"
            printf 'KI_CONFIG_HOME=%s\n' "$KI_CONFIG_HOME"
            printf 'KI_CACHE_HOME=%s\n' "$KI_CACHE_HOME"
            printf 'XDG_STATE_HOME=%s\n' "$XDG_STATE_HOME"
            printf 'KI_STATE_HOME=%s\n' "$KI_STATE_HOME"
          } >> "$GITHUB_ENV"
          printf '%s\n' "$KI_CLI_INSTALL_DIR" >> "$GITHUB_PATH"
      - name: Audit
        run: ki repo audit --repo .
      - name: Test website release event extraction
        run: ruby test/website_release_events_test.rb

  notify-website:
    name: Notify KI Website
    needs: governance
    if: >-
      needs.governance.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select formula releases
        id: releases
        env:
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          RETRY_FORMULA: ${{ inputs.formula }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            test "$RETRY_FORMULA" = "${RETRY_FORMULA##*/}"
            test "$RETRY_FORMULA" = "${RETRY_FORMULA%.rb}"
            formulas="Formula/$RETRY_FORMULA.rb"
            test -f "$formulas"
          elif [[ "$BEFORE_SHA" =~ ^0+$ ]]; then
            formulas=$(git diff-tree --no-commit-id --name-only -r "$CURRENT_SHA" -- 'Formula/*.rb')
          else
            formulas=$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" -- 'Formula/*.rb')
          fi

          : > "$RUNNER_TEMP/formula-releases"
          if [[ -n "$formulas" ]]; then
            while IFS= read -r formula; do
              ruby scripts/website-release-events.rb "$formula" >> "$RUNNER_TEMP/formula-releases"
            done <<< "$formulas"
          fi

          if [[ -s "$RUNNER_TEMP/formula-releases" ]]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "No formula release changes to notify." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Create release-bot token
        if: steps.releases.outputs.found == 'true'
        id: release-bot
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.KI_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KI_RELEASE_BOT_PRIVATE_KEY }}
          owner: knowledgeislands
          repositories: ki-website
      - name: Dispatch verified formula releases
        if: steps.releases.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ steps.release-bot.outputs.token }}
          TAP_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r release; do
            payload=$(jq -cn --argjson release "$release" --arg tap_commit "$TAP_COMMIT" '{event_type: "tool-release-published", client_payload: ($release + {tap_commit: $tap_commit})}')
            gh api --method POST repos/knowledgeislands/ki-website/dispatches --input - <<< "$payload"
            echo "Dispatched $(jq -r '.tool + " " + .version' <<< "$release")" >> "$GITHUB_STEP_SUMMARY"
          done < "$RUNNER_TEMP/formula-releases"
