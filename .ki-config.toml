# Knowledge Islands repository configuration.
# Its presence declares conformance with the Knowledge Islands repository standard.

[repo]
harnesses = ["knowledgeislands/ki-agentic-harness"]

[skills.ki-repo]
repository = "https://github.com/knowledgeislands/homebrew-tap"
title = "knowledgeislands/homebrew-tap"
description = "Homebrew formulae for Knowledge Islands command-line tools."
supported_runtimes = ["claude-code", "claude-desktop", "chatgpt-codex"]
visibility = "public"

# Custom topics describe this Homebrew tap more accurately than the default set.
[skills.ki-repo.checks]
topics = false

[skills.ki-git]

[skills.ki-authoring]

[skills.ki-repo-project]

[skills.ki-repo-homebrew-tap]

[skills.ki-trades]

[skills.ki-trades.routes."knowledgeislands/tools-git-almanac"]
import = ["work"]

[skills.ki-trades.routes."knowledgeislands/tools-ki"]
import = ["work"]

[skills.ki-trades.routes."knowledgeislands/tools-mgit"]
import = ["work"]

[skills.ki-tokenomics]

[skills.ki-housekeeping-claude]

[skills.ki-tokenomics-claude]

[skills.ki-tokenomics-codex]

[skills.ki-agora]

[skills.ki-agora.memberships.ki-all]
home = "https://github.com/knowledgeislands/ki-agentic-harness"
role = "maintainer"
